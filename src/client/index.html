ogue{position:fixed;z-index:var(--z-dialogue);left:50%;transform:translate(-50%);bottom:calc(var(--s5) + var(--safe-b));width:min(94vw,560px);background:linear-gradient(180deg,#232849f7,#101428fa);border:1px solid var(--stroke-strong);border-radius:var(--r3);padding:var(--s4) var(--s4) var(--s3);box-shadow:var(--e3),var(--inset-hair);animation:dlgIn var(--dur) var(--ease)}.dialogue:before{content:"";position:fixed;inset:0;z-index:-1}.dialogue .who{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}.dialogue .who .face{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#35406a,#1d2438);border:1px solid var(--stroke-strong);font-size:17px;flex:0 0 auto}.dialogue .who b{color:var(--aether);font-size:var(--t-md);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.dialogue .say{font-size:15px;line-height:1.55;min-height:3.1em;overflow-wrap:anywhere}.dialogue .hint{margin-top:var(--s2);text-align:start;font-size:var(--t-xs);color:var(--muted)}@keyframes dlgIn{0%{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%);opacity:1}}body.talking #action-cluster,body.talking #stick-zone,body.talking #prompt{opacity:.2;pointer-events:none;transition:opacity var(--dur) var(--ease)}#objective{position:absolute;z-index:var(--z-objective);pointer-events:none;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;text-shadow:0 2px 8px rgba(0,0,0,.8);transition:opacity var(--dur-slow) var(--ease)}#objective .arrow{font-size:15px;line-height:1;color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,200,97,.55));animation:objBob 1.6s ease-in-out infinite}#objective .what{font-size:var(--t-xs);font-weight:700;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis;background:#0b0e1ec2;border:1px solid rgba(255,200,97,.45);border-radius:var(--r1);padding:3px var(--s2)}#objective .far{font-size:10.5px;color:var(--gold);font-variant-numeric:tabular-nums}#objective.edge{transform:translate(-50%,-50%)}#objective.edge .what{opacity:.92}@keyframes objBob{0%,to{transform:translateY(0)}50%{transform:translateY(-3px)}}.creature-card{border:1px solid var(--stroke-strong);border-radius:var(--r3);overflow:hidden;background:linear-gradient(180deg,#ffffff0f,#ffffff05);box-shadow:var(--e3),inset 0 0 0 1px #ffffff0a;position:relative;flex-shrink:0}.creature-card:before{content:"";position:absolute;inset:-1px;border-radius:var(--r3);pointer-events:none;background:linear-gradient(140deg,color-mix(in srgb,var(--elem) 55%,transparent),transparent 55%);opacity:.35}.creature-card .art{height:152px;position:relative;display:grid;place-items:center}.creature-card .art:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,.55),transparent 60%)}.creature-card .art img{position:relative;z-index:1;height:146px;width:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.45))}.creature-card .badge,.creature-card .lvl{position:absolute;top:var(--s3);font-size:var(--t-xs);font-weight:800;background:#0b0e1eb8;border:1px solid var(--stroke);border-radius:var(--pill);padding:4px var(--s3);backdrop-filter:blur(6px);z-index:1;box-shadow:var(--e1)}.creature-card .badge{inset-inline-start:var(--s3)}.creature-card .lvl{inset-inline-end:var(--s3);color:var(--gold)}.creature-card .name{padding:var(--s3) var(--s4) 0;font-size:var(--t-xl);font-weight:900;overflow-wrap:anywhere}.stars{color:var(--gold);letter-spacing:1px}.creature-card .stars.big{display:block;padding:2px var(--s4);font-size:19px;letter-spacing:3px}.creature-card .power{padding:0 var(--s4) var(--s3);font-size:var(--t-sm);color:var(--muted)}.creature-card .power b{color:var(--text);font-size:var(--t-lg)}.statgrid{padding:0 var(--s4) var(--s3);display:flex;flex-direction:column;gap:5px}.statgrid .stat{display:grid;grid-template-columns:62px 1fr 46px;align-items:center;gap:var(--s2);font-size:var(--t-xs)}.statgrid .stat span{color:var(--muted)}.statgrid .stat i{display:block;height:6px;border-radius:var(--pill);background:linear-gradient(90deg,color-mix(in srgb,var(--elem) 80%,white 10%),var(--elem));box-shadow:0 0 10px color-mix(in srgb,var(--elem) 45%,transparent);transition:width var(--dur-slow) var(--ease)}.statgrid .stat b{text-align:end}.creature-card .chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 var(--s4) var(--s4)}.creature-card .chips .chip{min-height:34px;padding:0 var(--s3);font-size:var(--t-xs)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}#objective .arrow{animation:none}}

/* --- screen density ------------------------------------------------------ */
.hud-toggle{grid-column:1 / -1;height:26px;min-height:26px;width:100%;border-radius:var(--r1);
  background:var(--panel-soft);border:1px solid var(--stroke);color:var(--muted);font-size:13px;
  line-height:1;display:grid;place-items:center;backdrop-filter:blur(10px);box-shadow:var(--e1);
  transition:transform var(--dur) var(--ease),background var(--dur) var(--ease)}
.hud-toggle:active{background:var(--raise-2)}
body.hud-lean .hud-toggle{transform:rotate(180deg)}
body.hud-lean .top-right .icon-btn[data-panel]:not([data-panel="menu"]):not([data-panel="base"]){display:none}
body.hud-lean #tracker,body.hud-lean #chat-mini{display:none}
body.hud-lean .vitals{width:108px;padding:5px var(--s2)}
body.hud-lean .vitals .pet{display:none}
body.hud-lean #minimap{width:100px;height:100px}
#tracker h4{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:var(--s2)}
#tracker h4 .caret{transition:transform var(--dur) var(--ease);font-size:11px;opacity:.7}
#tracker.collapsed h4{margin-bottom:0}
#tracker.collapsed h4 .caret{transform:rotate(180deg)}
#tracker.collapsed .q{display:none}
#tracker.collapsed .q-lead{margin-bottom:0}

/* --- collection ---------------------------------------------------------- */
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:var(--s2)}
.dex-tile{display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--s2) var(--s1);
  border-radius:var(--r2);background:var(--raise);border:1px solid var(--stroke);box-shadow:var(--e1);
  font-size:var(--t-xs);line-height:1.25;min-height:74px;justify-content:center;
  border-inline-start:3px solid var(--elem,transparent);transition:transform .09s var(--ease),background var(--dur) var(--ease)}
.dex-tile:active{transform:scale(.97);background:var(--raise-2)}
.dex-tile .ico{font-size:19px}
.dex-tile b{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.dex-tile .n{color:var(--muted);font-size:10px}
.dex-tile.locked{opacity:.38;border-inline-start-color:var(--stroke);cursor:default}
.dex-tile.locked b{color:var(--faint)}

/* --- running as an app --------------------------------------------------- */
/* iOS changes the visual viewport when the address bar collapses without
   firing resize, so 100% height leaves the canvas short. --vh is the measured
   one; the dvh fallback covers browsers that do this correctly. */
html,body{height:100dvh}
#app{height:var(--vh,100dvh)}
body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  overscroll-behavior:none;touch-action:manipulation}
#world-canvas,#battle-canvas,#look-zone,#stick-zone{touch-action:none}
body.is-standalone{--safe-t:env(safe-area-inset-top,0px)}

/* Phone held sideways: the quest panel and chat come off, the stick and the
   action cluster move in, so the play area is not a letterbox of furniture. */
@media (orientation:landscape) and (max-height:520px){
  #tracker,#chat-mini{display:none}
  .top-left{flex-direction:row;align-items:flex-start;gap:var(--s2)}
  #minimap{width:58px;height:58px}
  .vitals{width:124px;padding:4px var(--s2)}
  .vitals .pet{display:none}
  .top-right{grid-template-columns:repeat(4,40px)}
  .icon-btn{width:40px;height:40px;font-size:17px}
  .icon-btn.wide{grid-column:1 / -1}
  #action-cluster{width:160px;height:160px}
  .action-main{width:70px;height:70px;font-size:var(--t-xs)}
  .skill-btn{width:46px;height:46px}
  .skill-btn.s0{right:80px;bottom:8px}.skill-btn.s1{right:68px;bottom:56px}
  .skill-btn.s2{right:24px;bottom:86px}.skill-btn.s3{right:86px;bottom:108px}
  #prompt{bottom:calc(172px + var(--safe-b))}
  #stick-zone{width:38%;height:62%}
}
.fs-btn{position:absolute;top:calc(var(--s3) + var(--safe-t));left:50%;transform:translateX(-50%);
  z-index:var(--z-hud);min-height:32px;padding:0 var(--s3);border-radius:var(--pill);
  background:var(--panel);border:1px solid var(--stroke-strong);color:var(--text);
  font-size:var(--t-xs);font-weight:700;box-shadow:var(--e2);backdrop-filter:blur(10px)}
.fs-btn:active{background:var(--raise-2)}

/* --- a quieter world screen ----------------------------------------------- */
/* Quests, friends and the guild live in the menu. Seven glyphs on the right
   was a column of furniture a third of the screen tall; three stay out — the
   menu, the bag and the team — because those are what a player reaches for
   between fights. The menu wears the friends badge, so nothing hidden can
   go unnoticed. */
:root{--stack-h:164px}
.top-right .icon-btn[data-panel="quests"],.top-right .icon-btn[data-panel="friends"],.top-right .icon-btn[data-panel="guild"]{display:none}
.top-right .icon-btn[data-panel="menu"]{order:1}
.top-right .icon-btn[data-panel="bag"]{order:2}
.top-right .icon-btn[data-panel="team"]{order:3}
.top-right .hud-toggle{order:4;grid-column:auto;width:44px;height:44px;min-height:44px;border-radius:var(--r2);font-size:15px}
.top-right .icon-btn.wide{order:5}

/* Collapsed, the tracker is one line: the quest and its count. The marker in
   the world already points the way, so a card saying the same thing again was
   a fifth of the screen spent twice. */
#tracker.collapsed{display:flex;align-items:center;gap:6px;width:auto;max-width:180px;padding:6px 10px 6px 8px}
#tracker.collapsed h4{font-size:0;margin:0;flex:0 0 auto;letter-spacing:0;opacity:1}
#tracker.collapsed h4 .caret{font-size:11px}
#tracker.collapsed #tracker-list{min-width:0;flex:1 1 auto}
#tracker.collapsed .q-lead{padding:0;margin:0;background:none;border:0;display:flex;align-items:center;gap:8px;min-width:0}
#tracker.collapsed .q-kicker,#tracker.collapsed .q-bar{display:none}
#tracker.collapsed .q-title{font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;margin:0}
#tracker.collapsed .q-meter{flex:0 0 auto;margin:0;font-size:11px;color:var(--muted)}
/* ...and sideways it goes away entirely, as it did before it learned to be one
   line: an id-and-class rule outranks the landscape block's id-only one. */
@media (orientation:landscape) and (max-height:520px){#tracker.collapsed{display:none}}

/* The fullscreen offer used to sit exactly on top of the chat line for its
   nine seconds; it goes under it instead. */
#chat-mini:not(:empty) ~ .fs-btn{top:calc(var(--s3) + var(--safe-t) + 76px)}

/* --- battle: theirs up top, yours with your hands ------------------------ */
/* Three full-width cards stacked at the top took a quarter of the screen and
   put your own health as far from your thumbs as it could get. The foe keeps
   a slim card at the top; your creature and you sit on top of your controls,
   the way every handheld battle screen has done it. */
.combat-bars{left:auto;width:min(66%,300px)}
.combat-bars.self{position:static;inset:auto;width:auto;max-width:none;max-height:none;gap:6px}
.combat-bars.self:empty{display:none}
.combat-row{padding:6px 10px}
.combat-row .name{font-size:12.5px;margin-bottom:3px}
.combat-row .fx:empty{display:none}
.combat-row .fx .e{font-size:11px}
/* While the team stands in front of you, your own health is a footnote: one
   slim line. It grows back into a full card the moment you are exposed. */
.combat-row.self.shielded{padding:4px 10px;opacity:.9}
.combat-row.self.shielded .name{font-size:11.5px;margin-bottom:2px}
.combat-row.self.shielded .bar{height:4px}
.combat-row.self.shielded .fx{display:none}

/* --- the creator's stage -------------------------------------------------- */
#creator-stage{display:block;width:100%;height:240px;margin:0 0 var(--s3);border-radius:var(--r3);
  background:radial-gradient(120% 90% at 50% 18%,#fdfbf2 0%,#cdeeff 46%,#8fd0f0 100%);
  box-shadow:inset 0 0 0 1px #ffffff40,var(--e1);touch-action:pan-y;cursor:grab}
#creator-stage:active{cursor:grabbing}
.starter .portrait{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 4px;
  filter:drop-shadow(0 3px 5px #0006)}
.starter .portrait+.dot{display:none}

/* --- the front door --------------------------------------------------------- */
/* The harbour renders live behind this screen, so it is glass: a wash at the
   top for the logo, a deeper one at the bottom for the button, and the town in
   between. */
#screen-title{justify-content:space-between;gap:0;overflow:hidden;
  background:linear-gradient(180deg,#0b0e1ecc 0%,#0b0e1e33 26%,transparent 44%,transparent 58%,#0b0e1e99 78%,#0b0e1ef2 100%)}
#screen-title .title-top{display:flex;flex-direction:column;align-items:center;gap:var(--s2);margin-top:4vh;text-align:center}
#screen-title .logo{width:min(84vw,380px);height:auto;filter:drop-shadow(0 6px 18px #0009);animation:titleFloat 5.5s ease-in-out infinite}
#screen-title .tagline{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em;color:#fff;text-shadow:0 2px 8px #000c}
#screen-title .title-bottom{display:flex;flex-direction:column;align-items:center;gap:var(--s3);width:100%;max-width:360px;margin-bottom:3vh}
#screen-title .title-sub{margin:0;min-height:1.3em;font-size:15px;font-weight:700;color:#fff;text-shadow:0 2px 8px #000c}
.btn.play{width:100%;min-height:62px;border-radius:999px;font-size:21px;font-weight:900;letter-spacing:.02em;color:#2a0d04;
  background:linear-gradient(180deg,#ffd27a 0%,#ff9a5a 55%,#ff7a59 100%);border:2px solid #fff8;
  box-shadow:0 10px 26px #ff7a5973,inset 0 2px 0 #fff8,inset 0 -3px 0 #0002;animation:playPulse 2.4s ease-in-out infinite}
.btn.play:active{transform:translateY(2px) scale(.98)}
.btn.play:disabled{animation:none;opacity:.75;filter:saturate(.6)}
.btn.small{min-height:38px;font-size:13px;opacity:.9}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes playPulse{0%,100%{box-shadow:0 10px 26px #ff7a5973,inset 0 2px 0 #fff8,inset 0 -3px 0 #0002}50%{box-shadow:0 12px 36px #ffb05aa6,inset 0 2px 0 #fff8,inset 0 -3px 0 #0002}}
@media (prefers-reduced-motion:reduce){#screen-title .logo,.btn.play{animation:none}}

/* --- battle bars: the hit lands, then the damage drains ------------------- */
.combat-row .bar.hp{position:relative}
.combat-row .bar.hp>i{position:relative}
.combat-row .bar.hp>.ghost{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:#ffc2b0;transition:width .75s cubic-bezier(.3,.7,.3,1) .38s}
.combat-row .bar.hp.low>.ghost{background:#ffd6cc}

/* --- errands: marks over heads, and the card an NPC hands you ------------- */
.nameplate .mark{display:inline-grid;place-items:center;width:18px;height:18px;margin-inline-end:5px;border-radius:50%;
  font:900 13px/1 system-ui;color:#fff;vertical-align:-3px}
.nameplate .mark.mnew{background:#ffb020;box-shadow:0 0 0 2px #fff,0 0 10px #ffb020aa;animation:markBob 1.4s ease-in-out infinite}
.nameplate .mark.mready{background:#22b86c;box-shadow:0 0 0 2px #fff,0 0 10px #22b86caa;animation:markBob 1.4s ease-in-out infinite}
.nameplate .mark.mbusy{background:#9aa3c4}
@keyframes markBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.dialogue.errand{cursor:default}
.errand-kicker{margin-top:6px;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--aether)}
.errand-title{margin:2px 0 4px;font-size:19px;font-weight:900}
.errand-desc{font-size:14px;opacity:.92}
.errand-have{margin-top:6px;font-size:12px;color:var(--gold)}
.errand-reward{margin-top:10px;padding:8px 10px;border-radius:12px;background:rgba(255,200,97,.12);border:1px solid rgba(255,200,97,.35);font-size:13px;line-height:1.45}
.errand-reward span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--gold)}
.errand-actions{display:flex;gap:8px;margin-top:12px}
.errand-actions .btn{flex:1}
@media (prefers-reduced-motion:reduce){.nameplate .mark{animation:none}}

/* The Hebrew half of the logo is page text, not SVG text: Safari lays out
   letter-spaced SVG text a glyph at a time, left to right, which printed the
   title backwards on every iPhone. */
#login-form{display:contents}
.remember{display:flex;align-items:center;gap:8px;margin:2px 0 6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.remember input{width:18px;height:18px;margin:0;accent-color:var(--aether)}
.logo-he{display:inline-block;margin:0 auto;padding-top:6px;border-top:1.4px solid rgba(47,230,208,.5);
  font:600 20px/1.2 'Segoe UI',Arial,sans-serif;letter-spacing:1.5px;color:#D9E4F7;text-align:center}
#screen-title .logo-he{text-shadow:0 2px 8px #000c;margin-top:-6px}

/* --- a light HUD over a bright world ------------------------------------- */
/* The world is a picture book now, and the HUD over it was night-time navy:
   heavy slabs on a sunny meadow. Everything that sits on the world while you
   walk is warm white glass with dark ink, and colour is kept for what means
   something — level gold, health green, the coral action. Panels that open
   over the world stay dark; they are a different room. The palette is swapped
   by redefining the tokens inside the HUD, so every rule that reads them
   follows without being rewritten. */
#hud,#overlay,#toasts,.fs-btn{
  --panel:rgba(255,252,246,.95);--panel-soft:rgba(255,252,246,.84);
  --raise:rgba(42,47,77,.05);--raise-2:rgba(42,47,77,.1);--sunken:rgba(42,47,77,.1);
  --stroke:rgba(255,255,255,.95);--stroke-strong:#fff;
  --text:#2a2f4d;--muted:#666d90;--faint:#8b91ae;--gold:#d7870a;
  --e1:0 1px 2px rgba(34,44,84,.12),0 3px 8px rgba(34,44,84,.14);
  --e2:0 2px 4px rgba(34,44,84,.12),0 8px 20px rgba(34,44,84,.2);
  --inset-hair:inset 0 1px 0 rgba(255,255,255,.8);
  color:var(--text)}
#hud .vitals{backdrop-filter:blur(12px) saturate(1.4)}
#hud .bar{background:rgba(42,47,77,.12);box-shadow:inset 0 1px 2px rgba(42,47,77,.18)}
#minimap{background:#fff;border:3px solid #fff;box-shadow:var(--e2)}
#hud .icon-btn{color:var(--text)}
#hud .icon-btn.wide{background:linear-gradient(135deg,#e2fbf6,#fffdf8 70%);border-color:#a8ece1;color:#136a5f}
#chat-mini{background:rgba(255,252,246,.8);border-color:#fff;color:var(--text);box-shadow:var(--e1)}
#tracker .q-bar{background:rgba(42,47,77,.12)}
#tracker .q-lead.daily{background:linear-gradient(135deg,rgba(42,47,77,.05),transparent 70%)}
.skill-btn{border-color:#fff;color:var(--text);box-shadow:var(--e2)}
.skill-btn .cd{background:rgba(42,47,77,.42)}
#stick-base{border-color:rgba(255,255,255,.85);background:radial-gradient(circle,rgba(255,255,255,.4),rgba(255,255,255,.14))}
#objective{text-shadow:0 1px 3px rgba(255,255,255,.9)}
#objective .what{background:rgba(255,252,246,.94);color:var(--text);border-color:#f3c46a;box-shadow:var(--e1)}
.nameplate{background:rgba(255,252,246,.9);color:var(--text);border-color:#fff;font-weight:700}
.nameplate .hpbar{background:rgba(42,47,77,.14)}
.nameplate .tag{color:#12877a}
.nameplate.wild{background:#fff3ea;border-color:#ffc3a8;color:#8a3413}
.nameplate.boss{background:#fff0f0;border-color:#ff9a95;color:#9c1c1c}
.dmg{text-shadow:0 2px 0 rgba(42,47,77,.55),0 0 8px rgba(42,47,77,.4);color:#fff}
/* The battle screen, in the same light: the arena is daylight too. */
#battle-hud{
  --panel:rgba(255,252,246,.96);--panel-soft:rgba(255,252,246,.86);
  --raise:rgba(255,255,255,.72);--raise-2:rgba(255,255,255,.9);--sunken:rgba(42,47,77,.1);
  --stroke:rgba(42,47,77,.1);--stroke-strong:rgba(42,47,77,.16);
  --text:#2a2f4d;--muted:#666d90;--faint:#8b91ae;--gold:#d7870a;
  --e1:0 1px 2px rgba(34,44,84,.12),0 3px 8px rgba(34,44,84,.12);
  --e2:0 2px 4px rgba(34,44,84,.12),0 8px 20px rgba(34,44,84,.18);
  --inset-hair:inset 0 1px 0 rgba(255,255,255,.8);
  color:var(--text)}
#battle-actions{background:linear-gradient(to top,rgba(255,250,240,.97) 58%,rgba(255,250,240,0))}
#battle-hud .bar{background:rgba(42,47,77,.12);box-shadow:inset 0 1px 2px rgba(42,47,77,.18)}
#battle-hud .sk .cd{background:rgba(42,47,77,.4)}
#battle-hud .combat-row.foe{border-color:#ffc0ab}
#battle-banner{color:#fff;text-shadow:0 3px 0 rgba(42,47,77,.55),0 6px 22px rgba(42,47,77,.45)}
.tm .face{width:36px;height:36px;margin:-8px -2px -8px -4px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(42,47,77,.3))}
#boss-banner{background:linear-gradient(180deg,rgba(255,244,242,.95),rgba(255,230,227,.95));border-color:#ff9a95}
#boss-banner .t{color:#a3231b}
.toast.good{border-color:#8fe7da}
.toast.bad{border-color:#ffb1ab}

        <label class="remember"><input type="checkbox" id="in-remember" checked /> זכור אותי במכשיר הזה</label>
        <div class="error-text" id="login-error" role="alert"></div>
        <button class="btn primary" id="btn-submit" type="submit">התחבר</button>
      </form>
      <button class="btn ghost" id="btn-guest" type="button">כניסה מהירה כאורח</button>
    </div>
  </div>

  <div id="screen-create" class="screen hidden">
    <div class="brand"><h1>יצירת דמות</h1><p>בחר מראה ויצור פתיחה</p></div>
    <div class="card">
      <canvas id="creator-stage" aria-label="תצוגה מקדימה של הדמות והיצור"></canvas>
      <div class="field"><label for="in-charname">שם הדמות</label><input id="in-charname" maxlength="16" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" /></div>
      <div class="field"><label>מבנה גוף</label><div class="picker" id="pick-body"></div></div>
      <div class="field"><label>גוון עור</label><div class="picker" id="pick-skin"></div></div>
      <div class="field"><label>צבע שיער</label><div class="picker" id="pick-hair"></div></div>
      <div class="field"><label>תלבושת</label><div class="picker" id="pick-outfit"></div></div>
      <div class="field"><label>יצור פתיחה</label><div class="starter-grid" id="pick-starter"></div></div>
      <div class="error-text" id="create-error" role="alert"></div>
      <button class="btn primary" id="btn-create">התחל את המסע</button>
    </div>
  </div>

  <div id="loading" role="status" aria-live="polite">
    <div style="text-align:center">
      <div class="spin" style="margin:0 auto"></div>
      <div class="msg" id="loading-msg">טוען את העולם…</div>
      <!-- Which build is this? Without it, "did my change ship?" can only be
           answered by hunting for a symptom. -->
      <div class="msg" id="build-stamp" dir="ltr" style="opacity:.45;font-size:11px;margin-top:6px">v0.13</div>
    </div>
  </div>
</div>

<script type="module" src="./main.js"></script>
</body></html>
