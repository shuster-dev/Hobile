# One-click deploy: https://render.com/deploy?repo=<this repo's URL>
#
# Render reads this file and creates the service already configured, so the
# only thing asked at create time is the Atlas connection string. AUTH_SECRET
# is generated by Render rather than pasted — it signs every session token, and
# a secret that has been through a chat window is not a secret.
services:
  - type: web
    name: hobile
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    # Israel -> Frankfurt is ~60ms; Oregon, the default, is ~160ms. In a game
    # where the server is authoritative over movement, that gap is the
    # difference between walking and skating.
    region: frankfurt
    # Free spins down after 15 minutes idle and takes ~50s to wake. Fine for
    # sharing a link; move to starter before anyone is asked to play seriously.
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DB_DRIVER
        value: mongo
      # Asked for at create time and never stored in the repo.
      - key: MONGO_URL
        sync: false
      - key: MONGO_DB
        value: hobile
      # The server serves its own client, so there is no cross-origin request
      # to allow. Narrow this only if the client is ever hosted elsewhere.
      - key: CORS_ORIGIN
        value: "*"
      - key: MAX_PLAYERS_PER_ZONE
        value: "60"
