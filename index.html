<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Hobile V1</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <div id="app">
    <canvas id="gameCanvas" aria-label="Hobile game view"></canvas>

    <div id="rotateNotice" class="rotate-notice hidden">
      <div class="rotate-card">
        <div class="rotate-icon">↻</div>
        <strong>Rotate your phone</strong>
        <span>Hobile is designed for landscape play.</span>
      </div>
    </div>

    <div id="menu" class="screen active">
      <div class="brand-wrap">
        <div class="eyebrow">TACTICAL MOBILE FPS</div>
        <h1>HOBILE</h1>
        <p>V1 · TRAINING YARD</p>
        <button id="playButton" class="primary-button">PLAY</button>
        <div class="menu-tip">Landscape mode · Headphones recommended</div>
      </div>
    </div>

    <div id="deathScreen" class="screen hidden">
      <div class="panel compact">
        <div class="eyebrow danger">ELIMINATED</div>
        <h2>Training failed</h2>
        <p id="deathStats">Score 0</p>
        <button id="restartButton" class="primary-button">RESTART</button>
      </div>
    </div>

    <div id="hud" class="hud hidden" aria-hidden="true">
      <div class="topbar">
        <div class="score-card"><span class="label">SCORE</span><span id="scoreValue">0</span></div>
        <div class="mission-card"><span id="aliveValue">0</span> TARGETS</div>
      </div>

      <div id="damageFlash" class="damage-flash"></div>
      <div id="hitmarker" class="hitmarker"><i></i><i></i><i></i><i></i></div>
      <div id="crosshair" class="crosshair"><span></span><span></span><span></span><span></span></div>

      <div class="hud-left-bottom">
        <div class="stat-block hp"><span>HP</span><strong id="hpValue">100</strong></div>
      </div>

      <div class="hud-right-bottom">
        <div class="weapon-name">VX-7</div>
        <div class="ammo"><strong id="magValue">24</strong><span>/</span><span id="reserveValue">96</span></div>
        <div id="reloadLabel" class="reload-label hidden">RELOADING</div>
      </div>

      <div id="joystickZone" class="joystick-zone">
        <div id="joystickBase" class="joystick-base"><div id="joystickKnob" class="joystick-knob"></div></div>
      </div>

      <div id="lookZone" class="look-zone"></div>

      <button id="fireButton" class="control-button fire" aria-label="Fire">FIRE</button>
      <button id="reloadButton" class="control-button reload" aria-label="Reload">R</button>
      <button id="jumpButton" class="control-button jump" aria-label="Jump">JUMP</button>
    </div>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
