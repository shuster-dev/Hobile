# Publishes the single-player build to GitHub Pages on every push to main.
#
# This is what makes the game installable on an iPhone. Safari on iPhone has no
# Fullscreen API, so the only way to lose the browser chrome is Add to Home
# Screen — and that needs the page served from its own origin with a manifest,
# which an embedded preview can never be. A Pages URL gives us exactly that,
# for free, with no server to run.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The rules have to pass before anything reaches a phone.
      - run: npm run qa

      - run: npm run build:web && npm run build:solo

      # Pages serves the client; the single-player build is the default entry
      # so the link works with no server behind it.
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r dist/web/* site/
          cp dist/solo.html site/solo.html
          cp dist/solo.html site/index.html
          cp src/client/manifest.webmanifest src/client/sw.js src/client/icon.svg site/
          # Pages would otherwise run the output through Jekyll and drop files
          # whose names start with an underscore.
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
