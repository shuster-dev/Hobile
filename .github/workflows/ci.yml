name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The store production runs. Every step below that does not ask for it uses
    # the memory store, which hands every room the same object for a player —
    # the one property that hid a data-loss bug in the Mongo store for as long as
    # nothing tested against Mongo. tools/store-test.mjs has the story.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Pure game logic: data integrity, the capture curve, zone boundaries,
      # and the battle-v2 contract. Seconds, no browser.
      - name: Game rules
        run: npm run qa

      # Boots the real server and connects two real clients to it.
      - name: Multiplayer
        run: npm run test:server

      - name: Multiplayer on MongoDB
        run: npm run test:server
        env:
          DB_DRIVER: mongo
          MONGO_URL: mongodb://127.0.0.1:27017/
          MONGO_DB: ci_multiplayer

      # One player in two sessions — a phone that has not dropped its old tab —
      # and then a restart, so the last word comes from a process with nothing
      # in memory. The Mongo run is the one that matters: it is what players get.
      - name: Persistence (memory store)
        run: npm run test:store
      - name: Persistence (MongoDB)
        run: npm run test:store
        env:
          DB_DRIVER: mongo
          MONGO_URL: mongodb://127.0.0.1:27017/

      - name: Build
        run: npm run build

      # The client only really passes when it renders, so this one drives a
      # browser: create a character, enter the world, assert zero console
      # errors and a render budget of 280 draw calls / 420k triangles.
      - name: Browser smoke test
        run: npx playwright install --with-deps chromium && node tools/smoke.mjs

      # Arriving at a camp must never frame a roof instead of the player: the
      # camera's idea of a house is traced against the real one's triangles.
      - name: Camera never hides the player
        run: node tools/camera-test.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
