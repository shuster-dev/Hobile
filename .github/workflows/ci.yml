name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Pure game logic: data integrity, the capture curve, zone boundaries,
      # and the battle-v2 contract. Seconds, no browser.
      - name: Game rules
        run: npm run qa

      # Boots the real server and connects two real clients to it.
      - name: Multiplayer
        run: npm run test:server

      - name: Build
        run: npm run build

      # The client only really passes when it renders, so this one drives a
      # browser: create a character, enter the world, assert zero console
      # errors and a render budget of 280 draw calls / 420k triangles.
      - name: Browser smoke test
        run: npx playwright install --with-deps chromium && node tools/smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
          retention-days: 7
